<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0E1E2E" />
        <stop offset="100%" stop-color="#071018" />
      </linearGradient>
      <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4A5D6E" />
        <stop offset="100%" stop-color="#2B3946" />
      </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect width="500" height="360" fill="url(#bgGrad)"/>
    
    <!-- Industrial Grid Texture -->
    <path d="M0 60 H500 M0 120 H500 M0 180 H500 M0 240 H500 M0 300 H500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    
    <!-- Strata Accent Strip Top -->
    <rect x="0" y="0" width="500" height="6" fill="#4A5D6E"/>

    <!-- Category Badge -->
    <rect x="28" y="24" width="170" height="26" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="113" y="41" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">20MM / 40MM CRUSHED</text>

    <!-- Visual Icon Representation -->
    <g transform="translate(0, 10)">
      <polygon points="140,280 180,210 240,230 260,280" fill="#6B8296"/>
           <polygon points="230,280 270,195 330,225 350,280" fill="#546A7D"/>
           <polygon points="180,280 230,220 280,240 300,280" fill="#3D4E5E"/>
           <ellipse cx="250" cy="275" rx="170" ry="30" fill="#2B3946"/>
    </g>

    <!-- Title & Subtitle Card Overlay -->
    <rect x="20" y="275" width="460" height="70" rx="12" fill="rgba(10,22,34,0.92)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="36" y="303" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">BLUE METAL (AGGREGATES)</text>
    <text x="36" y="327" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#94A3B8">20mm & 40mm Hard Granite Crushed Aggregates</text>
    
    <!-- Direct Supply Tag -->
    <circle cx="445" cy="310" r="14" fill="#4A5D6E" opacity="0.2"/>
    <path d="M440 310 L444 314 L452 306" stroke="#4A5D6E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>