<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0E1E2E" />
        <stop offset="100%" stop-color="#071018" />
      </linearGradient>
      <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#475569" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
    </defs>
    <!-- Background Card -->
    <rect width="500" height="360" fill="url(#bgGrad)"/>
    
    <!-- Industrial Grid Texture -->
    <path d="M0 60 H500 M0 120 H500 M0 180 H500 M0 240 H500 M0 300 H500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    
    <!-- Strata Accent Strip Top -->
    <rect x="0" y="0" width="500" height="6" fill="#475569"/>

    <!-- Category Badge -->
    <rect x="28" y="24" width="170" height="26" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="113" y="41" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">FAST SITE CLEARANCE</text>

    <!-- Visual Icon Representation -->
    <g transform="translate(0, 10)">
      <polygon points="160,260 210,200 270,220 280,260" fill="#64748B"/>
           <polygon points="250,260 290,210 330,230 350,260" fill="#475569"/>
           <ellipse cx="250" cy="275" rx="150" ry="25" fill="#1E293B"/>
    </g>

    <!-- Title & Subtitle Card Overlay -->
    <rect x="20" y="275" width="460" height="70" rx="12" fill="rgba(10,22,34,0.92)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="36" y="303" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">CONSTRUCTION DEBRIS REMOVAL</text>
    <text x="36" y="327" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Site Waste, Concrete Rubble & Dismantling Clearance</text>
    
    <!-- Direct Supply Tag -->
    <circle cx="445" cy="310" r="14" fill="#475569" opacity="0.2"/>
    <path d="M440 310 L444 314 L452 306" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>