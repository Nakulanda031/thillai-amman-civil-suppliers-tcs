<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
    <defs>
      <linearGradient id="eqBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="540" height="380" rx="16" fill="url(#eqBg)"/>
    <rect x="2" y="2" width="536" height="376" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- Grid Backdrop -->
    <path d="M0 60 H540 M0 120 H540 M0 180 H540 M0 240 H540 M0 300 H540" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    
    <!-- Top Capacity Pill -->
    <rect x="32" y="28" width="220" height="28" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="142" y="46" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8" text-anchor="middle" letter-spacing="1">HEAVY EXCAVATION & TRENCHING</text>

    <!-- Machinery Illustration -->
    <g transform="translate(100, 110)">
      <!-- JCB Body -->
      <rect x="90" y="90" width="90" height="60" rx="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <!-- Cabin Glass -->
      <rect x="110" y="95" width="40" height="35" rx="3" fill="#0A1622" stroke="#FBBF24" stroke-width="1.5"/>
      <!-- Front Loader Arm & Bucket -->
      <path d="M180 120 L230 140 L250 120" stroke="#B45309" stroke-width="6" fill="none"/>
      <polygon points="245,115 270,120 265,150 240,145" fill="#334155" stroke="#F59E0B" stroke-width="1.5"/>
      <!-- Rear Excavator Arm -->
      <path d="M90 120 L40 80 L10 130" stroke="#B45309" stroke-width="6" fill="none"/>
      <polygon points="10,130 5,145 25,150 20,135" fill="#334155"/>
      <!-- Wheels (Front Smaller, Rear Bigger) -->
      <circle cx="110" cy="172" r="28" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
      <circle cx="110" cy="172" r="12" fill="#F59E0B"/>
      <circle cx="205" cy="172" r="19" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
      <circle cx="205" cy="172" r="8" fill="#F59E0B"/>
    </g>

    <!-- Ground Level -->
    <line x1="40" y1="305" x2="500" y2="305" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Footer Overlay -->
    <rect x="24" y="316" width="492" height="48" rx="8" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="40" y="345" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">JCB 3DX BACKHOE EXCAVATOR</text>
    <text x="500" y="345" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11.5" fill="#10B981" text-anchor="end">● AVAILABLE IN COIMBATORE</text>
  </svg>