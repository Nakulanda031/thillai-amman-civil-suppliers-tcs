<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
    <defs>
      <linearGradient id="eqBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="540" height="380" rx="16" fill="url(#eqBg)"/>
    <rect x="2" y="2" width="536" height="376" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- Grid Backdrop -->
    <path d="M0 60 H540 M0 120 H540 M0 180 H540 M0 240 H540 M0 300 H540" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    
    <!-- Top Capacity Pill -->
    <rect x="32" y="28" width="220" height="28" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="142" y="46" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8" text-anchor="middle" letter-spacing="1">CONFINED SPACE EARTHWORK</text>

    <!-- Machinery Illustration -->
    <g transform="translate(130, 110)">
      <!-- Loader Body -->
      <polygon points="40,80 120,80 140,130 40,130" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <!-- Cabin Roll Cage -->
      <rect x="60" y="85" width="45" height="35" rx="3" fill="#0A1622" stroke="#FFFFFF" stroke-width="1.5"/>
      <!-- Lift Arm & Bucket -->
      <path d="M50 100 L150 105 L175 125" stroke="#334155" stroke-width="5" fill="none"/>
      <polygon points="170,115 195,120 190,145 165,140" fill="#475569" stroke="#F59E0B" stroke-width="1.5"/>
      <!-- Heavy Wheels -->
      <circle cx="65" cy="155" r="22" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
      <circle cx="65" cy="155" r="9" fill="#F59E0B"/>
      <circle cx="125" cy="155" r="22" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
      <circle cx="125" cy="155" r="9" fill="#F59E0B"/>
    </g>

    <!-- Ground Level -->
    <line x1="40" y1="305" x2="500" y2="305" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Footer Overlay -->
    <rect x="24" y="316" width="492" height="48" rx="8" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="40" y="345" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">BULL SKID STEER LOADER</text>
    <text x="500" y="345" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11.5" fill="#10B981" text-anchor="end">● AVAILABLE IN COIMBATORE</text>
  </svg>