<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#navyGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Construction Geometric Grid Lines -->
  <path d="M60 256 H452 M256 60 V452" stroke="rgba(56,189,248,0.08)" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Outer Hexagonal Emblem -->
  <polygon points="256,64 424,160 424,352 256,448 88,352 88,160" fill="none" stroke="url(#skyGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Central Emblem Elements: Strata Layers -->
  <g transform="translate(136, 150)">
    <!-- Sand Layer -->
    <path d="M20 20 H220 L200 44 H40 Z" fill="#D97706" opacity="0.9" />
    <!-- Aggregate Blue Metal Layer -->
    <path d="M35 52 H205 L188 76 H52 Z" fill="#0284C7" opacity="0.95" />
    <!-- Stone Foundation Layer -->
    <path d="M48 84 H192 L176 108 H64 Z" fill="#64748B" />
  </g>

  <!-- TCS Bold Monogram -->
  <text x="256" y="320" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="92" fill="url(#silverGrad)" text-anchor="middle" letter-spacing="4">TCS</text>

  <!-- Brand Accent Underline -->
  <rect x="176" y="340" width="160" height="6" rx="3" fill="url(#skyGrad)" />
  
  <!-- Tagline Text in Circle / Curve -->
  <text x="256" y="390" font-family="'Montserrat', sans-serif" font-weight="700" font-size="20" fill="#38BDF8" text-anchor="middle" letter-spacing="5">THILLAI AMMAN</text>
  <text x="256" y="416" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="4">CIVIL SUPPLIERS</text>
</svg>
